<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Spring Chat</title>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; color: #222; }
button { font: inherit; cursor: pointer; border: none; border-radius: 8px; padding: 8px 12px; background: #6db33f; color: #fff; }
button.ghost { background: #fff; color: #333; border: 1px solid #ccc; }
button.danger { background: #d9534f; }
button:disabled { opacity: .5; cursor: not-allowed; }
input, textarea { font: inherit; padding: 9px 12px; border: 1px solid #ccc; border-radius: 10px; outline: none; }
input:focus, textarea:focus { border-color: #6db33f; }
.hidden { display: none !important; }
.err { color: #d9534f; font-size: .9rem; min-height: 1em; }
.muted { color: #666; font-size: .9rem; }

/* Auth */
#auth { height: 100%; display: flex; align-items: center; justify-content: center; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.1); padding: 24px; width: min(380px, 92vw); display: flex; flex-direction: column; gap: 10px; }
.card h2 { margin: 0 0 4px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }

/* Layout */
#app { height: 100%; display: flex; }
#sidebar { width: 320px; background: #fff; border-right: 1px solid #e5e5e5; display: flex; flex-direction: column; min-height: 0; }
#main { flex: 1; display: flex; flex-direction: column; background: #fff; min-width: 0; }
.topbar { background: #6db33f; color: #fff; padding: 10px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.topbar .title { font-weight: 600; flex: 1; min-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar button { background: rgba(255,255,255,.2); padding: 6px 10px; font-size: .85rem; }
.topbar button.danger { background: #c9302c; }
.welcome { margin: 12px; padding: 12px; background: #eef8e6; border-radius: 10px; font-size: .92rem; }
.sidebar-tools { padding: 0 12px 8px; display: flex; flex-direction: column; gap: 8px; }
.sidebar-tools .row button { flex: 1; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: .9rem; cursor: pointer; }
.switch { position: relative; width: 40px; height: 22px; display: inline-block; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.slider { position: absolute; inset: 0; background: #ccc; border-radius: 22px; transition: .2s; }
.slider:before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
.switch input:checked + .slider { background: #6db33f; }
.switch input:checked + .slider:before { transform: translateX(18px); }
.list { flex: 1; overflow-y: auto; }
.section { font-size: .75rem; text-transform: uppercase; color: #888; padding: 10px 14px 4px; letter-spacing: .05em; }
.item { padding: 10px 14px; cursor: pointer; display: flex; flex-direction: column; border-bottom: 1px solid #f3f3f3; }
.item:hover, .item.active { background: #f1f8ec; }
.item small { color: #777; }
.empty { color: #888; padding: 8px 14px; font-size: .9rem; }

/* Messages */
#messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #e5ddd5; }
.msg { max-width: 72%; background: #fff; padding: 8px 10px; border-radius: 12px; overflow-wrap: anywhere; align-self: flex-start; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
.msg.own { align-self: flex-end; background: #dcf8c6; }
.msg .meta { font-size: .72rem; color: #666; margin-bottom: 3px; }
.msg .body { white-space: pre-wrap; }
.msg a { color: #1565c0; }
.msg img, .msg video { max-width: 100%; max-height: 240px; border-radius: 8px; display: block; }
.msg img { cursor: zoom-in; }
.file-card { display: flex; align-items: center; gap: 8px; background: #f7f7f7; padding: 8px 10px; border-radius: 8px; margin-bottom: 4px; overflow-wrap: anywhere; }
.icon { width: 18px; height: 18px; flex-shrink: 0; vertical-align: middle; }
.topbar button .icon { margin-right: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.actions button { background: #f0f0f0; color: #333; padding: 4px 8px; font-size: .8rem; }
.event { align-self: center; background: rgba(255,255,255,.75); padding: 4px 10px; border-radius: 10px; font-size: .85rem; color: #555; }

/* Composer */
.composer { border-top: 1px solid #e5e5e5; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.composer .attach { display: flex; gap: 6px; flex-wrap: wrap; }
.composer .attach button { background: #f0f0f0; color: #333; font-size: .85rem; padding: 6px 10px; }
.composer .line { display: flex; gap: 8px; }
.composer .line input { flex: 1; border-radius: 20px; }
#transfers { padding: 0 8px; }

/* Animated transfer indicator (upload / download) */
.transfer { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #f5f7fb; border-radius: 10px; margin-top: 6px; }
.transfer svg { width: 38px; height: 38px; flex-shrink: 0; }
.transfer .ring { transform: rotate(-90deg); transform-origin: 18px 18px; transition: stroke-dashoffset .25s linear; }
.transfer.indeterminate svg { animation: spin 1.2s linear infinite; }
.transfer.indeterminate .ring { stroke-dasharray: 30 64.25 !important; stroke-dashoffset: 0 !important; }
.transfer.upload .arrow { animation: bobUp 1s ease-in-out infinite; }
.transfer.download .arrow { animation: bobDown 1s ease-in-out infinite; }
.transfer.done .arrow, .transfer.fail .arrow { animation: none; }
.transfer.done .ring { stroke: #6db33f; }
.transfer.fail .ring { stroke: #d9534f; }
.transfer .t-info { flex: 1; min-width: 0; font-size: .85rem; }
.transfer .t-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.transfer .t-state { color: #666; }
.transfer.fail .t-state { color: #d9534f; }
.transfer button { background: #e5e5e5; color: #333; padding: 4px 8px; font-size: .8rem; }
@keyframes bobUp { 0%,100% { transform: translateY(3px); } 50% { transform: translateY(-3px); } }
@keyframes bobDown { 0%,100% { transform: translateY(-3px); } 50% { transform: translateY(3px); } }
@keyframes spin { to { transform: rotate(360deg); } }

/* Modals and in-app browser */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal-box { background: #fff; border-radius: 12px; max-width: min(900px, 96vw); max-height: 92vh; width: 100%; display: flex; flex-direction: column; overflow: hidden; }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid #e5e5e5; gap: 8px; }
.modal-head .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal-body { overflow: auto; padding: 14px; flex: 1; }
.modal-body img, .modal-body video { max-width: 100%; max-height: 76vh; display: block; margin: auto; }
.modal-body pre { background: #1e1e1e; color: #ddd; padding: 12px; border-radius: 8px; overflow: auto; font-size: .85rem; white-space: pre; }
.modal-body pre code { font-family: ui-monospace, Menlo, Consolas, monospace; }
.kw { color: #c586c0; }
.cm { color: #6a9955; }
.md code { background: #f1f1f1; padding: 1px 4px; border-radius: 4px; }
.md pre code { background: none; }
.md li { margin-left: 20px; }
.profile { display: flex; flex-direction: column; gap: 10px; width: min(420px, 80vw); }
.profile textarea { min-height: 90px; resize: vertical; }
.profile label { font-size: .85rem; color: #555; }

#inapp { position: fixed; inset: 0; z-index: 70; background: #fff; display: flex; flex-direction: column; }
.inapp-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #f5f5f5; border-bottom: 1px solid #ddd; }
#inappUrl { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; }
.inapp-head a { font-size: .85rem; color: #1565c0; white-space: nowrap; }
.inapp-head button { background: #e5e5e5; color: #333; padding: 6px 10px; font-size: .85rem; }
#inappFrame { flex: 1; border: 0; width: 100%; }
.inapp-note { font-size: .8rem; color: #666; padding: 6px 12px; border-top: 1px solid #eee; }

/* Dark mode: applied when <body> has the "dark" class */
body.dark { background: #121212; color: #e6e6e6; }
body.dark #sidebar, body.dark #main, body.dark .card, body.dark .modal-box, body.dark #inapp { background: #1e1e1e; color: #e6e6e6; }
body.dark #sidebar { border-right-color: #333; }
body.dark .composer { border-top-color: #333; }
body.dark .welcome { background: #22331c; color: #e6e6e6; }
body.dark .item { border-bottom-color: #2a2a2a; }
body.dark .item:hover, body.dark .item.active { background: #263a1f; }
body.dark .item small, body.dark .section, body.dark .empty, body.dark .muted, body.dark .meta, body.dark .transfer .t-state { color: #9aa0a6; }
body.dark #messages { background: #0f1418; }
body.dark .msg { background: #2a2a2a; color: #e6e6e6; }
body.dark .msg.own { background: #2d5a27; }
body.dark .msg a { color: #8ab4f8; }
body.dark .file-card { background: #333; }
body.dark .event { background: rgba(0,0,0,.45); color: #ccc; }
body.dark .actions button, body.dark .composer .attach button { background: #333; color: #eee; }
body.dark input, body.dark textarea { background: #2a2a2a; color: #eee; border-color: #444; }
body.dark button.ghost { background: #2a2a2a; color: #eee; border-color: #444; }
body.dark .slider { background: #555; }
body.dark .transfer { background: #262626; }
body.dark .transfer button { background: #3a3a3a; color: #eee; }
body.dark .modal-head { border-bottom-color: #333; }
body.dark .modal-body pre { background: #0d0d0d; }
body.dark .md code { background: #333; }
body.dark .inapp-head { background: #2a2a2a; border-bottom-color: #333; }
body.dark .inapp-head button { background: #3a3a3a; color: #eee; }
body.dark .inapp-head a { color: #8ab4f8; }
body.dark .inapp-note { color: #aaa; border-top-color: #333; }

/* Sending and failed states */
.msg.pending { opacity: .7; }
.msg.failed { outline: 1px solid #d9534f; }
.msg .status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .75rem; color: #666; margin-top: 4px; }
.msg.failed .status { color: #d9534f; }
.msg .status button { padding: 2px 8px; font-size: .75rem; }
.transfer .t-actions { display: flex; gap: 6px; }

/* Profile picture */
.avatar-row { display: flex; align-items: center; gap: 14px; }
.avatar { width: 72px; height: 72px; border-radius: 50%; background: #6db33f; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 600; overflow: hidden; flex-shrink: 0; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar-actions { display: flex; flex-direction: column; gap: 6px; }

/* Spring Chat video player (replaces the browser's native controls) */
.vplayer { position: relative; background: #000; border-radius: 8px; overflow: hidden; max-width: 100%; line-height: 0; outline: none; }
.vplayer:focus-visible { box-shadow: 0 0 0 2px #6db33f; }
.vplayer video { width: 100%; max-height: 240px; display: block; background: #000; object-fit: contain; cursor: pointer; }
.vplayer.big video { max-height: 76vh; }
.vp-center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; transition: opacity .2s; }
.vp-big { pointer-events: auto; width: 56px; height: 56px; border-radius: 50%; border: none; padding: 0; background: rgba(109,179,63,.92); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.vp-big svg { width: 28px; height: 28px; }
.vplayer.playing .vp-center { opacity: 0; }
.vplayer.playing:hover .vp-center, .vplayer.playing:focus-within .vp-center { opacity: 1; }
.vp-bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 18px 8px 6px; background: linear-gradient(transparent, rgba(0,0,0,.8)); color: #fff; line-height: 1.2; transition: opacity .25s; }
.vplayer.idle .vp-bar { opacity: 0; pointer-events: none; }
.vplayer.idle { cursor: none; }
.vp-bar button { background: transparent; border: none; color: #fff; padding: 4px; border-radius: 6px; display: flex; align-items: center; justify-content: center; width: auto; height: auto; }
.vp-bar button:hover { background: rgba(255,255,255,.18); }
.vp-bar button svg { width: 20px; height: 20px; }
body.layout-mobile .vp-bar button { min-height: 0; }
.vp-bar input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 4px; padding: 0; margin: 0; cursor: pointer; background: linear-gradient(to right, #6db33f var(--p, 0%), rgba(255,255,255,.35) var(--p, 0%)); border: none; }
.vp-bar input[type=range]:focus { outline: none; }
.vp-bar input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: none; }
.vp-bar input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: none; }
.vp-seek { flex: 1; min-width: 60px; }
.vp-vol { width: 70px; }
.vp-time { font-size: .75rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.vp-loading { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.35); pointer-events: none; }
.vplayer.loading .vp-loading { display: flex; }
.vplayer.loading .vp-center { display: none; }
.vp-spinner { width: 42px; height: 42px; border-radius: 50%; border: 4px solid rgba(255,255,255,.28); border-top-color: #6db33f; animation: vpSpin .8s linear infinite; }
@keyframes vpSpin { to { transform: rotate(360deg); } }
.vp-error { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: #000; color: #ddd; font-size: .85rem; line-height: 1.4; text-align: center; padding: 12px; cursor: pointer; }
.vplayer.failed .vp-error { display: flex; }
.vplayer.failed .vp-loading, .vplayer.failed .vp-center, .vplayer.failed .vp-bar { display: none; }
.vp-speed { font-size: .75rem; font-weight: 600; min-width: 40px; }
.vp-menu { position: absolute; right: 8px; bottom: 44px; background: rgba(20,20,20,.95); border-radius: 8px; padding: 4px; display: flex; flex-direction: column; min-width: 96px; box-shadow: 0 4px 14px rgba(0,0,0,.4); z-index: 2; }
.vp-menu button { background: transparent; border: none; color: #fff; text-align: left; padding: 6px 10px; font-size: .8rem; border-radius: 6px; width: 100%; }
.vp-menu button:hover { background: rgba(255,255,255,.15); }
.vp-menu button.active { color: #6db33f; font-weight: 600; }
body.layout-mobile .vp-menu button, body.layout-mobile .vp-speed { min-height: 0; }

/* App dialogs (replace the browser's alert, confirm and prompt) */
#dialog { position: fixed; inset: 0; z-index: 95; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.dlg-card { background: #fff; color: #222; border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.25); padding: 20px; width: min(380px, 92vw); display: flex; flex-direction: column; gap: 10px; }
.dlg-title { font-weight: 600; font-size: 1.05rem; }
.dlg-msg { white-space: pre-wrap; overflow-wrap: anywhere; color: #444; }
.dlg-card input { width: 100%; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
body.dark .dlg-card { background: #1e1e1e; color: #e6e6e6; }
body.dark .dlg-msg { color: #bbb; }

/* Upload menu */
.upload-menu-wrap { position: relative; }
.composer .upload-menu { position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 5; display: flex; flex-direction: column; min-width: 170px; padding: 6px; background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.15); }
.composer .upload-menu .um-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; background: transparent; color: #222; font-size: .9rem; text-align: left; }
.composer .upload-menu .um-item:hover { background: #f1f8ec; }
.composer .upload-menu .um-item svg { width: 18px; height: 18px; flex-shrink: 0; color: #6db33f; }
body.dark .composer .upload-menu { background: #1e1e1e; border-color: #333; }
body.dark .composer .upload-menu .um-item { color: #eee; }
body.dark .composer .upload-menu .um-item:hover { background: #263a1f; }

/* Reply and delete */
.reply-bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #f1f8ec; border-left: 3px solid #6db33f; border-radius: 8px; font-size: .85rem; }
.reply-bar span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reply-bar button { background: transparent; color: #333; padding: 2px 8px; font-size: .8rem; }
.quote { border-left: 3px solid #6db33f; background: rgba(0,0,0,.05); padding: 4px 8px; border-radius: 6px; margin-bottom: 6px; font-size: .8rem; color: #555; overflow-wrap: anywhere; }
.msg.deleted .deleted-text { font-style: italic; color: #888; }
body.dark .reply-bar { background: #263a1f; color: #e6e6e6; }
body.dark .reply-bar button { color: #eee; }
body.dark .quote { background: rgba(255,255,255,.07); color: #bbb; }


/* Group editor */
.edit-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.edit-tabs button.active { background: #6db33f; color: #fff; border-color: #6db33f; }
.edit-content { display: flex; flex-direction: column; gap: 10px; }
.check { display: flex; align-items: center; gap: 8px; font-size: .95rem; }
.check input { width: auto; min-height: 0; }
.role-badge { font-size: .75rem; color: #6db33f; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

/* Group general settings */
.group-general { display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid #e5e5e5; }
body.dark .group-general { border-bottom-color: #333; }

/* Fullscreen button: mobile UI only */
body.layout-pc .fs-toggle { display: none; }
body.layout-mobile .fs-toggle { min-height: 36px; }

/* Plugins */
.key-box { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; word-break: break-all; background: #f5f5f5; padding: 10px; border-radius: 8px; border: 1px dashed #6db33f; }
body.dark .key-box { background: #2a2a2a; color: #eee; }

/* Reports */
.report-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.report-actions { display: flex; gap: 6px; flex-shrink: 0; }
.report-actions button { padding: 4px 8px; font-size: .8rem; }

/* 404 page */
#notFound { position: fixed; inset: 0; z-index: 80; background: #f0f2f5; display: flex; align-items: center; justify-content: center; padding: 16px; }
.nf-card { background: #fff; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,.1); padding: 32px 28px; width: min(420px, 92vw); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.nf-icon { width: 56px; height: 56px; color: #6db33f; }
.nf-code { font-size: 4rem; font-weight: 700; color: #6db33f; line-height: 1; }
.nf-card h2 { margin: 4px 0 0; }
.nf-card p { margin: 0 0 8px; color: #666; }
body.dark #notFound { background: #121212; }
body.dark .nf-card { background: #1e1e1e; color: #e6e6e6; }
body.dark .nf-card p { color: #9aa0a6; }

/* Ban panel */
.ban-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
body.dark .ban-row { border-bottom-color: #333; }


/* Mobile UI: one screen at a time (list or chat), larger touch targets */
body.layout-mobile #sidebar { width: 100%; }
body.layout-mobile #main { display: none; }
body.layout-mobile.show-chat #main { display: flex; }
body.layout-mobile.show-chat #sidebar { display: none; }
body.layout-mobile button, body.layout-mobile input, body.layout-mobile textarea { min-height: 44px; }
body.layout-mobile .item { padding: 14px 16px; font-size: 1.05rem; }
body.layout-mobile .topbar { padding: 12px; }
body.layout-mobile .topbar .title { font-size: 1.05rem; }
body.layout-mobile .msg { max-width: 88%; }
body.layout-mobile #messages { padding: 12px; }
body.layout-mobile .composer .attach { display: grid; grid-template-columns: 1fr 1fr; }
body.layout-mobile .composer .attach button { width: 100%; }
body.layout-mobile .modal { padding: 0; }
body.layout-mobile .modal-box { max-height: 100vh; max-width: 100vw; height: 100vh; border-radius: 0; }
body.layout-mobile .card { width: 94vw; }
body.layout-mobile .composer .line input { font-size: 16px; }
body.layout-mobile #app { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }

/* Mobile landscape: a phone turned sideways shows the list and chat side by side, in a compact layout */
@media (orientation: landscape) and (max-height: 600px) {
  body.layout-mobile #sidebar { display: flex; width: 240px; flex-shrink: 0; }
  body.layout-mobile #main { display: flex; }
  body.layout-mobile.show-chat #sidebar { display: flex; }
  body.layout-mobile .welcome { display: none; }
  body.layout-mobile .sidebar-tools { padding: 0 8px 6px; gap: 6px; }
  body.layout-mobile .section { padding: 6px 12px 2px; }
  body.layout-mobile .item { padding: 8px 12px; font-size: .95rem; }
  body.layout-mobile .topbar { padding: 6px 10px; gap: 6px; }
  body.layout-mobile .topbar .title { font-size: .95rem; }
  body.layout-mobile .topbar button { padding: 4px 8px; font-size: .8rem; }
  body.layout-mobile button, body.layout-mobile input, body.layout-mobile textarea { min-height: 36px; }
  body.layout-mobile #messages { padding: 8px; gap: 6px; }
  body.layout-mobile .msg { max-width: 80%; font-size: .95rem; }
  body.layout-mobile .vplayer video { max-height: 150px; }
  body.layout-mobile .composer { padding: 6px; gap: 4px; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script>
const $ = id => document.getElementById(id);

// ---------- state ----------
let token = localStorage.getItem('chatToken');
let me = null;
let contacts = [];
let groups = [];
let room = null;          // { id, kind: 'dm'|'group', title, username?, groupId? }
let stomp = null;
let sub = null;
let inApp = localStorage.getItem('inApp') === '1';

let pendingJoin = null;
if (location.hash.startsWith('#join/')) {
  pendingJoin = location.hash.slice(6);
  history.replaceState(null, '', location.pathname);
}

const ICONS = {
  file: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  back: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>'
};

const UPLOAD_INPUTS = { image: 'fileImage', video: 'fileVideo', gif: 'fileGif', file: 'fileAny' };
const TEXT_EXT = ['text', 'txt', 'md'];
const CODE_EXT = ['py', 'js', 'mjs', 'cjs', 'css', 'html', 'htm', 'xml', 'svg', 'java'];
const KEYWORDS = ('abstract assert async await break case catch class const continue def default del do elif else ' +
  'enum except export extends false finally for from function if implements import in instanceof interface is ' +
  'lambda let new None null package private protected public raise return self static super switch this throw ' +
  'throws true try typeof var void while with yield int boolean string float double char long short').split(' ');

// ---------- API helpers ----------
async function api(path, opts = {}) {
  const headers = {};
  if (token) headers['Authorization'] = 'Bearer ' + token;
  let body;
  if (opts.json !== undefined) {
    headers['Content-Type'] = 'application/json';
    body = JSON.stringify(opts.json);
  }
  const res = await fetch(path, { method: opts.method || 'GET', headers, body });
  if (!res.ok) {
    let msg = res.statusText || 'Request failed';
    try { msg = JSON.parse(await res.text()).message || msg; } catch (e) {}
    throw new Error(msg);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function forgetToken() {
  token = null;
  localStorage.removeItem('chatToken');
}

// ---------- auth ----------
async function authenticate(path) {
  $('authErr').textContent = '';
  try {
    const data = await api(path, {
      method: 'POST',
      json: {
        username: $('authUser').value.trim(),
        password: $('authPass').value,
        displayName: $('authName').value.trim(),
        email: $('authEmail').value.trim()
      }
    });
    token = data.token;
    localStorage.setItem('chatToken', token);
    await startSession();
  } catch (e) {
    $('authErr').textContent = e.message;
  }
}
$('loginBtn').onclick = () => authenticate('/api/auth/login');
$('signupBtn').onclick = () => authenticate('/api/auth/signup');
$('authPass').addEventListener('keydown', e => { if (e.key === 'Enter') authenticate('/api/auth/login'); });

$('logoutBtn').onclick = async () => {
  try { await api('/api/auth/logout', { method: 'POST' }); } catch (e) {}
  forgetToken();
  location.reload();
};

$('deleteAccountBtn').onclick = async () => {
  if (!await uiConfirm('Delete your account permanently? This cannot be undone.')) return;
  try {
    await api('/api/me', { method: 'DELETE' });
  } catch (e) {
    uiAlert(e.message);
    return;
  }
  forgetToken();
  location.reload();
};

function renderWelcome() {
  $('welcome').textContent = `Welcome to chat, ${me.displayName}! Pick a contact or group to start chatting.`;
}

async function startSession() {
  me = await api('/api/me');
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  renderWelcome();
  $('adminBar').classList.toggle('hidden', !me.admin);
  ensureSocket().catch(() => {});
  await refreshLists();

  if (pendingJoin) {
    const code = pendingJoin;
    pendingJoin = null;
    try {
      const g = await api('/api/groups/join/' + encodeURIComponent(code), { method: 'POST' });
      await refreshLists();
      openRoom(toGroupRoom(g));
    } catch (e) {
      showNotFound('Invite link not found', e.message);
    }
  }
}

// ---------- WebSocket ----------
function connectSocket() {
  return new Promise((resolve, reject) => {
    const s = Stomp.over(new SockJS('/ws'));
    s.debug = null;
    s.connect({}, () => {
      stomp = s;
      // Personal channel: tells this account when a group it belongs to is deleted
      if (me) {
        s.subscribe('/topic/user/' + me.username, frame => {
          const m = JSON.parse(frame.body);
          if (m.type === 'GROUP_DELETED') handleGroupDeleted(m);
        });
      }
      resolve();
    }, () => {
      stomp = null;
      reject(new Error('Chat connection lost'));
    });
  });
}

async function ensureSocket() {
  if (!stomp || !stomp.connected) await connectSocket();
}

// ---------- sidebar ----------
function toDmRoom(c) { return { id: c.roomId, kind: 'dm', title: c.displayName, username: c.username }; }
function toGroupRoom(g) { return { id: g.roomId, kind: 'group', title: g.name, groupId: g.id, owner: g.owner }; }

async function refreshLists() {
  [contacts, groups] = await Promise.all([api('/api/contacts'), api('/api/groups')]);
  renderLists();
}

function listItem(title, sub, active, onClick) {
  const d = document.createElement('div');
  d.className = 'item' + (active ? ' active' : '');
  const t = document.createElement('span');
  t.textContent = title;
  const s = document.createElement('small');
  s.textContent = sub;
  d.append(t, s);
  d.onclick = onClick;
  return d;
}

function sectionHeader(text) {
  const h = document.createElement('div');
  h.className = 'section';
  h.textContent = text;
  return h;
}

function emptyNote(text) {
  const e = document.createElement('div');
  e.className = 'empty';
  e.textContent = text;
  return e;
}

function renderLists() {
  const q = $('search').value.trim().toLowerCase();
  const box = $('lists');
  box.innerHTML = '';

  const cs = contacts.filter(c => (c.username + ' ' + c.displayName).toLowerCase().includes(q));
  const gs = groups.filter(g => g.name.toLowerCase().includes(q));

  box.append(sectionHeader('Contacts'));
  if (!cs.length) box.append(emptyNote(q ? 'No matching contacts.' : 'No contacts yet. Use "New contact".'));
  cs.forEach(c => box.append(listItem(c.displayName, '@' + c.username,
    !!room && room.id === c.roomId, () => openRoom(toDmRoom(c)))));

  box.append(sectionHeader('Groups'));
  if (!gs.length) box.append(emptyNote(q ? 'No matching groups.' : 'No groups yet. Use "New group".'));
  gs.forEach(g => box.append(listItem(g.name, g.memberCount + ' members',
    !!room && room.id === g.roomId, () => openRoom(toGroupRoom(g)))));
}

$('search').oninput = renderLists;

$('newContactBtn').onclick = async () => {
  const name = (await uiPrompt('Username of the person to add:') || '').trim();
  if (!name) return;
  try {
    await api('/api/contacts', { method: 'POST', json: { username: name } });
    await refreshLists();
    const c = contacts.find(x => x.username === name);
    if (c) openRoom(toDmRoom(c));
  } catch (e) {
    uiAlert(e.message);
  }
};

$('newGroupBtn').onclick = async () => {
  const name = (await uiPrompt('Group name:') || '').trim();
  if (!name) return;
  try {
    const g = await api('/api/groups', { method: 'POST', json: { name } });
    await refreshLists();
    openRoom(toGroupRoom(g));
  } catch (e) {
    uiAlert(e.message);
  }
};

$('inappToggle').checked = inApp;
$('inappToggle').addEventListener('change', e => {
  inApp = e.target.checked;
  localStorage.setItem('inApp', inApp ? '1' : '0');
});

// ---------- dark mode ----------
let darkMode = localStorage.getItem('darkMode') === '1';

function applyDarkMode(on) {
  darkMode = on;
  document.body.classList.toggle('dark', on);
  localStorage.setItem('darkMode', on ? '1' : '0');
  document.querySelectorAll('.dark-switch').forEach(sw => { sw.checked = on; });
}

document.querySelectorAll('.dark-switch').forEach(sw => {
  sw.addEventListener('change', e => applyDarkMode(e.target.checked));
});
applyDarkMode(darkMode);

// ---------- fullscreen (mobile UI) ----------
const fsButtons = document.querySelectorAll('.fs-toggle');
const fsSupported = !!document.documentElement.requestFullscreen;

function updateFullscreenButtons() {
  const on = !!document.fullscreenElement;
  fsButtons.forEach(btn => {
    btn.textContent = on ? 'Exit fullscreen' : 'Fullscreen';
    btn.setAttribute('aria-pressed', String(on));
  });
}

fsButtons.forEach(btn => {
  btn.addEventListener('click', async () => {
    if (!fsSupported) {
      uiAlert('Fullscreen is not supported in this browser. On iPhone, add Spring Chat to your Home Screen and open it from there.');
      return;
    }
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
    } catch (e) {
      uiAlert('Fullscreen could not be turned on in this browser.');
    }
  });
});

document.addEventListener('fullscreenchange', updateFullscreenButtons);
updateFullscreenButtons();

// ---------- layout: mobile UI or PC UI ----------
function defaultLayout() {
  return window.matchMedia('(max-width: 760px)').matches ? 'mobile' : 'pc';
}

let layout = localStorage.getItem('layout');
if (layout !== 'mobile' && layout !== 'pc') layout = defaultLayout();

function applyLayout(mode) {
  layout = mode;
  document.body.classList.remove('layout-mobile', 'layout-pc');
  document.body.classList.add('layout-' + mode);
  localStorage.setItem('layout', mode);
}

document.querySelectorAll('[data-layout]').forEach(btn => {
  btn.addEventListener('click', () => applyLayout(btn.dataset.layout));
});
applyLayout(layout);

// ---------- profile ----------
function renderAvatar(el, user) {
  el.innerHTML = '';
  if (user.avatarUrl) {
    const img = document.createElement('img');
    img.src = user.avatarUrl;
    img.alt = '';
    el.append(img);
  } else {
    el.textContent = (user.displayName || user.username || '?').charAt(0).toUpperCase();
  }
}

$('profileBtn').onclick = () => {
  const wrap = document.createElement('div');
  wrap.className = 'profile';
  wrap.innerHTML = `
    <div class="avatar-row">
      <div id="pAvatar" class="avatar"></div>
      <div class="avatar-actions">
        <button id="pUpload" class="ghost">Upload image</button>
        <button id="pRemove" class="ghost">Remove photo</button>
        <input type="file" id="pFile" accept="image/png,image/jpeg,image/gif,image/webp" class="hidden">
      </div>
    </div>
    <div id="pAvatarMsg" class="muted"></div>
    <label>Username</label>
    <input id="pUser" disabled>
    <label>Display name</label>
    <input id="pName">
    <label>Bio</label>
    <textarea id="pBio"></textarea>
    <div class="row"><button id="pSave">Save</button></div>
    <div id="pMsg" class="muted"></div>`;
  wrap.querySelector('#pUser').value = me.username;
  wrap.querySelector('#pName').value = me.displayName;
  wrap.querySelector('#pBio').value = me.bio || '';
  const avatarEl = wrap.querySelector('#pAvatar');
  const avatarMsg = wrap.querySelector('#pAvatarMsg');
  renderAvatar(avatarEl, me);
  openModal('Profile', wrap);

  wrap.querySelector('#pUpload').onclick = () => wrap.querySelector('#pFile').click();

  wrap.querySelector('#pFile').onchange = async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      avatarMsg.textContent = 'Choose an image file.';
      return;
    }
    avatarMsg.textContent = 'Uploading...';
    try {
      const upload = uploadWithProgress(file, p => {
        avatarMsg.textContent = 'Uploading... ' + Math.round(p * 100) + '%';
      });
      const meta = await upload.promise;
      me = await api('/api/me/avatar', { method: 'PUT', json: { fileId: meta.id } });
      renderAvatar(avatarEl, me);
      avatarMsg.textContent = 'Profile image updated.';
    } catch (err) {
      avatarMsg.textContent = 'Failed to upload the image.' + (err.message ? ' ' + err.message : '');
    }
  };

  wrap.querySelector('#pRemove').onclick = async () => {
    try {
      me = await api('/api/me/avatar', { method: 'DELETE' });
      renderAvatar(avatarEl, me);
      avatarMsg.textContent = 'Profile image removed.';
    } catch (err) {
      avatarMsg.textContent = err.message;
    }
  };

  wrap.querySelector('#pSave').onclick = async () => {
    try {
      me = await api('/api/me', {
        method: 'PUT',
        json: { displayName: wrap.querySelector('#pName').value, bio: wrap.querySelector('#pBio').value }
      });
      renderWelcome();
      renderAvatar(avatarEl, me);
      wrap.querySelector('#pMsg').textContent = 'Saved.';
      await refreshLists();
    } catch (e) {
      wrap.querySelector('#pMsg').textContent = e.message;
    }
  };
};

// ---------- chat header: profile and unban ----------
$('viewProfileBtn').onclick = async () => {
  if (!room || room.kind !== 'dm') return;
  try {
    const u = await api('/api/users/' + encodeURIComponent(room.username));
    const wrap = document.createElement('div');
    wrap.className = 'profile';

    const row = document.createElement('div');
    row.className = 'avatar-row';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    renderAvatar(avatar, u);

    const info = document.createElement('div');
    info.className = 'report-info';
    const name = document.createElement('strong');
    name.textContent = u.displayName;
    const handle = document.createElement('span');
    handle.className = 'muted';
    handle.textContent = '@' + u.username;
    info.append(name, handle);
    if (u.admin) {
      const badge = document.createElement('span');
      badge.className = 'muted';
      badge.textContent = 'Admin';
      info.append(badge);
    }
    row.append(avatar, info);

    const bio = document.createElement('div');
    bio.className = 'muted';
    bio.textContent = u.bio || 'No bio yet.';
    wrap.append(row, bio);
    openModal('Profile of ' + u.displayName, wrap);
  } catch (e) {
    uiAlert(e.message);
  }
};

$('unbanUserBtn').onclick = async () => {
  if (!room || room.kind !== 'dm') return;
  if (!await uiConfirm(`Unban @${room.username}?`)) return;
  try {
    await api('/api/bans/' + encodeURIComponent(room.username), { method: 'DELETE' });
    uiAlert(`Unbanned @${room.username}.`);
    await updateModerationButtons();
  } catch (e) {
    uiAlert(e.message);
  }
};

// Admins see "Ban user" for active contacts and "Unban user" for banned ones
async function updateModerationButtons() {
  const ban = $('banUserBtn');
  const unban = $('unbanUserBtn');

    ban.classList.toggle('hidden', banned);
    unban.classList.toggle('hidden', !banned);
  } catch (e) {
    // Keep the buttons as they are if the ban list cannot be loaded
  }
}

function openBanPanel() {
  const wrap = document.createElement('div');
  wrap.className = 'profile';
  wrap.innerHTML = `
    <label>Ban a user</label>
    <div class="row">
      <input id="banName" placeholder="Username" style="flex:1">
      <button id="banAdd" class="danger">Ban</button>
    </div>
    <div id="banMsg" class="muted"></div>
    <label>Reports</label>
    <div id="reportList"></div>
    <label>Banned users</label>
    <div id="banList"></div>`;
  openModal('Ban management', wrap);

  const msg = wrap.querySelector('#banMsg');
  const list = wrap.querySelector('#banList');

  const load = async () => {
    list.innerHTML = '';
    try {
      const names = await api('/api/bans');
      if (!names.length) {
        const none = document.createElement('div');
        none.className = 'muted';
        none.textContent = 'No banned users.';
        list.append(none);
        return;
      }
      names.forEach(name => {
        const row = document.createElement('div');
        row.className = 'ban-row';
        const label = document.createElement('span');
        label.textContent = '@' + name;
        const unban = document.createElement('button');
        unban.className = 'ghost';
        unban.textContent = 'Unban';
        unban.onclick = async () => {
          try {
            await api('/api/bans/' + encodeURIComponent(name), { method: 'DELETE' });
            msg.textContent = 'Unbanned @' + name + '.';
            await load();
          } catch (e) {
            msg.textContent = e.message;
          }
        };
        row.append(label, unban);
        list.append(row);
      });
    } catch (e) {
      msg.textContent = e.message;
    }
  };

  const reportList = wrap.querySelector('#reportList');

  const loadReports = async () => {
    reportList.innerHTML = '';
    try {
      const reports = await api('/api/reports');
      if (!reports.length) {
        const none = document.createElement('div');
        none.className = 'muted';
        none.textContent = 'No reports.';
        reportList.append(none);
        return;
      }
      reports.forEach(r => {
        const row = document.createElement('div');
        row.className = 'ban-row';

        const info = document.createElement('div');
        info.className = 'report-info';
        const who = document.createElement('span');
        who.textContent = `@${r.target} reported by @${r.reporter}`;
        const why = document.createElement('small');
        why.className = 'muted';
        why.textContent = r.reason || 'No reason given';
        info.append(who, why);

        const actions = document.createElement('div');
        actions.className = 'report-actions';
        const banBtn = document.createElement('button');
        banBtn.className = 'danger';
        banBtn.textContent = 'Ban';
        banBtn.onclick = async () => {
          try {
            await api('/api/bans', { method: 'POST', json: { username: r.target } });
            msg.textContent = 'Banned @' + r.target + '.';
            await load();
            await loadReports();
          } catch (e) {
            msg.textContent = e.message;
          }
        };
        const dismissBtn = document.createElement('button');
        dismissBtn.className = 'ghost';
        dismissBtn.textContent = 'Dismiss';
        dismissBtn.onclick = async () => {
          try {
            await api('/api/reports/' + encodeURIComponent(r.id), { method: 'DELETE' });
            await loadReports();
          } catch (e) {
            msg.textContent = e.message;
          }
        };
        actions.append(banBtn, dismissBtn);
        row.append(info, actions);
        reportList.append(row);
      });
    } catch (e) {
      msg.textContent = e.message;
    }
  };

  wrap.querySelector('#banAdd').onclick = async () => {
    const input = wrap.querySelector('#banName');
    const name = input.value.trim();
    if (!name) return;
    try {
      await api('/api/bans', { method: 'POST', json: { username: name } });
      msg.textContent = 'Banned @' + name + '.';
      input.value = '';
      await load();
    } catch (e) {
      msg.textContent = e.message;
    }
  };

  load();
  loadReports();
}

  room = r;
  document.body.classList.add('show-chat');
  $('chatTitle').textContent = r.title;
  $('copyLinkBtn').classList.toggle('hidden', r.kind !== 'group');
  $('leaveGroupBtn').classList.toggle('hidden', r.kind !== 'group');
  $('editGroupBtn').classList.add('hidden');
  $('deleteGroupBtn').classList.toggle('hidden', !(r.kind === 'group' && (r.owner === me.username || me.admin)));
  $('deleteAllMsgsBtn').classList.toggle('hidden', !(r.kind === 'group' && (r.owner === me.username || me.admin)));
  $('deleteContactBtn').classList.toggle('hidden', r.kind !== 'dm');

  await ensureSocket();
  if (sub) sub.unsubscribe();

    if (m.type === 'GROUP_DELETED') {

  history.forEach(addMessage);

  updateGroupEditButton();

// ---------- message rendering ----------
function linkify(text, container) {
  const re = /https?:\/\/[^\s<]+/g;
  let last = 0;
  let m;
  while ((m = re.exec(text))) {
    if (m.index > last) container.append(text.slice(last, m.index));
    const url = m[0];
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = url;
    a.addEventListener('click', e => {
      if (inApp) { e.preventDefault(); openInApp(url); }
    });
    container.append(a);
    last = re.lastIndex;
  }
  if (last < text.length) container.append(text.slice(last));
}

function messageActions(m, extra = []) {
  const list = [...extra, ['Reply', () => startReply(m)]];
  if (m.sender === me.username || me.admin) list.push(['Delete', () => deleteMessage(m)]);
  return list;
}

function addMessage(m) {
  const box = $('messages');
  const div = document.createElement('div');
  div.className = 'msg' + (m.sender === me.username ? ' own' : '') + (m.deleted ? ' deleted' : '');
  div.dataset.id = m.id;

  const meta = document.createElement('div');
  meta.className = 'meta';
  const time = new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  meta.textContent = `${m.sender} • ${time}`;
  div.append(meta);

  if (m.replySender) {
    const quote = document.createElement('div');
    quote.className = 'quote';
    const who = document.createElement('strong');
    who.textContent = '@' + m.replySender;
    const snippet = document.createElement('div');
    snippet.textContent = m.replyText || '';
    quote.append(who, snippet);
    div.append(quote);
  }

  if (m.deleted) {
    const gone = document.createElement('div');
    gone.className = 'body deleted-text';
    gone.textContent = 'This message was deleted';
    div.append(gone);
  } else if (m.type === 'TEXT') {
    const body = document.createElement('div');
    body.className = 'body';
    linkify(m.content || '', body);
    div.append(body);
    div.append(actionsRow(messageActions(m, [['Read text', () => speak(m.content || '')]])));
  } else {
    div.append(renderAttachment(m));
    div.append(actionsRow(messageActions(m)));
  }

  // A message that arrives again (for example after a delete) replaces the old one
  const existing = box.querySelector(`[data-id="${m.id}"]`);
  if (existing) existing.replaceWith(div);
  else box.append(div);
  box.scrollTop = box.scrollHeight;
}

function extOf(name) {
  const i = (name || '').lastIndexOf('.');
  return i < 0 ? '' : name.slice(i + 1).toLowerCase();
}

function renderAttachment(m) {
  const wrap = document.createElement('div');
  const url = `/api/files/${m.fileId}`;
  const ext = extOf(m.fileName);

  if (m.type === 'IMAGE' || m.type === 'GIF') {
    const img = document.createElement('img');
    img.src = url;
    img.alt = m.fileName;
    img.onclick = () => previewMedia(m);
    wrap.append(img);
  } else if (m.type === 'VIDEO') {
    wrap.append(buildVideoPlayer(url, { name: m.fileName }));
  } else {
    const card = document.createElement('div');
    card.className = 'file-card';
    card.innerHTML = ICONS.file;
    const label = document.createElement('span');
    label.textContent = m.fileName;
    card.append(label);
    wrap.append(card);
  }

  const kindLabel = { IMAGE: 'image', VIDEO: 'video', GIF: 'GIF', FILE: 'file' }[m.type];
  const acts = [];
  if (m.type !== 'FILE') acts.push(['Preview', () => previewMedia(m)]);
  acts.push([`Save ${kindLabel}`, () => downloadFile(url, m.fileName)]);
  if (TEXT_EXT.includes(ext)) {
    acts.push(['View text', () => viewText(m)]);
    acts.push(['Read text', () => readFile(m)]);
  }
  if (CODE_EXT.includes(ext)) {
    acts.push(['View code', () => viewCode(m)]);
    acts.push(['Read code', () => readFile(m)]);
  }
  wrap.append(actionsRow(acts));
  return wrap;
}

// ---------- video player ----------
const VP_ICON = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>',
  volume: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  mute: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z" fill="currentColor"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>',
  save: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  fullscreen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>'
};

function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const total = Math.floor(sec);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = String(total % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`;
}

function buildVideoPlayer(src, opts = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'vplayer loading' + (opts.big ? ' big' : '');
  wrap.tabIndex = 0;

  const video = document.createElement('video');
  video.src = src;
  video.preload = 'metadata';
  video.playsInline = true;
  if (opts.autoplay) video.autoplay = true;

  const center = document.createElement('div');
  center.className = 'vp-center';
  const bigBtn = document.createElement('button');
  bigBtn.className = 'vp-big';
  bigBtn.setAttribute('aria-label', 'Play');
  bigBtn.innerHTML = VP_ICON.play;
  center.append(bigBtn);

  const bar = document.createElement('div');
  bar.className = 'vp-bar';
  const playBtn = document.createElement('button');
  playBtn.setAttribute('aria-label', 'Play');
  playBtn.innerHTML = VP_ICON.play;

  const seek = document.createElement('input');
  seek.type = 'range';
  seek.className = 'vp-seek';
  seek.min = 0;
  seek.max = 1000;
  seek.step = 1;
  seek.value = 0;
  seek.setAttribute('aria-label', 'Seek');

  const time = document.createElement('span');
  time.className = 'vp-time';
  time.textContent = '0:00 / 0:00';

  const muteBtn = document.createElement('button');
  muteBtn.setAttribute('aria-label', 'Mute');
  muteBtn.innerHTML = VP_ICON.volume;

  const vol = document.createElement('input');
  vol.type = 'range';
  vol.className = 'vp-vol';
  vol.min = 0;
  vol.max = 1;
  vol.step = 0.05;
  vol.value = 1;
  vol.setAttribute('aria-label', 'Volume');

  const fullBtn = document.createElement('button');
  fullBtn.setAttribute('aria-label', 'Fullscreen');
  fullBtn.innerHTML = VP_ICON.fullscreen;

  // Playback speed: button shows the current rate and opens a menu
  const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];
  const speedBtn = document.createElement('button');
  speedBtn.className = 'vp-speed';
  speedBtn.setAttribute('aria-label', 'Playback speed');
  speedBtn.textContent = '1x';

  const setSpeed = rate => {
    video.playbackRate = rate;
    speedBtn.textContent = rate + 'x';
    menu.querySelectorAll('button').forEach(b => b.classList.toggle('active', Number(b.dataset.rate) === rate));
  };
  const stepSpeed = dir => {
    const current = SPEEDS.indexOf(video.playbackRate);
    const from = current < 0 ? SPEEDS.indexOf(1) : current;
    setSpeed(SPEEDS[Math.min(SPEEDS.length - 1, Math.max(0, from + dir))]);
  };

  const menu = document.createElement('div');
  menu.className = 'vp-menu hidden';
  SPEEDS.forEach(rate => {
    const option = document.createElement('button');
    option.dataset.rate = rate;
    option.textContent = rate + 'x';
    option.onclick = e => {
      e.stopPropagation();
      setSpeed(rate);
      menu.classList.add('hidden');
    };
    menu.append(option);
  });
  speedBtn.onclick = e => {
    e.stopPropagation();
    menu.classList.toggle('hidden');
  };

  const saveBtn = document.createElement('button');
  saveBtn.className = 'vp-save';
  saveBtn.setAttribute('aria-label', 'Save video');
  saveBtn.title = 'Save video';
  saveBtn.innerHTML = VP_ICON.save;
  saveBtn.onclick = e => {
    e.stopPropagation();
    downloadFile(src, opts.name || 'video');
  };

  bar.append(playBtn, seek, time, muteBtn, vol, speedBtn, saveBtn, fullBtn);
  const loading = document.createElement('div');
  loading.className = 'vp-loading';
  loading.innerHTML = '<div class="vp-spinner" role="status" aria-label="Loading video"></div>';

  const errorBox = document.createElement('div');
  errorBox.className = 'vp-error';
  errorBox.textContent = 'This video could not be loaded. Click to try again.';
  errorBox.onclick = () => {
    wrap.classList.remove('failed');
    wrap.classList.add('loading');
    video.load();
  };

  wrap.append(video, loading, errorBox, center, bar, menu);
  setSpeed(1);

  const setFill = (el, pct) => el.style.setProperty('--p', pct + '%');
  let dragging = false;

  const updateTime = () => {
    time.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
  };
  const updateSeek = () => {
    if (dragging || !video.duration) return;
    seek.value = (video.currentTime / video.duration) * 1000;
    setFill(seek, seek.value / 10);
  };
  const syncMute = () => {
    muteBtn.innerHTML = (video.muted || video.volume === 0) ? VP_ICON.mute : VP_ICON.volume;
    muteBtn.setAttribute('aria-label', video.muted ? 'Unmute' : 'Mute');
  };

  const togglePlay = () => {
    menu.classList.add('hidden');
    if (video.paused) video.play().catch(() => {});
    else video.pause();
  };

  bigBtn.onclick = togglePlay;
  playBtn.onclick = togglePlay;
  video.onclick = togglePlay;

  video.addEventListener('play', () => {
    wrap.classList.add('playing');
    playBtn.innerHTML = VP_ICON.pause;
    playBtn.setAttribute('aria-label', 'Pause');
    wake();
  });
  const onStop = () => {
    wrap.classList.remove('playing', 'idle');
    playBtn.innerHTML = VP_ICON.play;
    playBtn.setAttribute('aria-label', 'Play');
  };
  video.addEventListener('pause', onStop);
  video.addEventListener('ended', onStop);
  video.addEventListener('loadedmetadata', () => { updateTime(); updateSeek(); });
  video.addEventListener('timeupdate', () => { updateTime(); updateSeek(); });
  video.addEventListener('volumechange', () => {
    vol.value = video.muted ? 0 : video.volume;
    setFill(vol, vol.value * 100);
    syncMute();
  });

  seek.addEventListener('pointerdown', () => { dragging = true; });
  seek.addEventListener('input', () => {
    if (video.duration) video.currentTime = (seek.value / 1000) * video.duration;
    setFill(seek, seek.value / 10);
    updateTime();
  });
  seek.addEventListener('change', () => { dragging = false; });
  seek.addEventListener('pointerup', () => { dragging = false; });

  vol.addEventListener('input', () => {
    video.volume = Number(vol.value);
    video.muted = Number(vol.value) === 0;
    setFill(vol, vol.value * 100);
    syncMute();
  });
  muteBtn.onclick = () => {
    video.muted = !video.muted;
    if (!video.muted && video.volume === 0) video.volume = 0.5;
    syncMute();
  };

  fullBtn.onclick = () => {
    if (document.fullscreenElement) {
      document.exitFullscreen().catch(() => {});
    } else {
      wrap.requestFullscreen?.().catch?.(() => {});
    }
  };

  // Loading state: show the spinner while the video is loading, buffering or seeking
  const showLoading = () => { if (!wrap.classList.contains('failed')) wrap.classList.add('loading'); };
  const hideLoading = () => wrap.classList.remove('loading');
  ['loadstart', 'waiting', 'stalled', 'seeking'].forEach(name => video.addEventListener(name, showLoading));
  ['loadedmetadata', 'loadeddata', 'canplay', 'playing', 'seeked'].forEach(name => video.addEventListener(name, () => {
    wrap.classList.remove('failed');
    hideLoading();
  }));
  video.addEventListener('error', () => {
    wrap.classList.remove('loading');
    wrap.classList.add('failed');
  });

  // Hide the controls after two seconds of no movement while playing
  let idleTimer = null;
  const wake = () => {
    wrap.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (!video.paused) wrap.classList.add('idle');
    }, 2000);
  };
  wrap.addEventListener('mousemove', wake);
  wrap.addEventListener('touchstart', wake, { passive: true });

  // Keyboard: space or K toggles play, arrows seek, M mutes, F fullscreen
  wrap.addEventListener('keydown', e => {
    if (e.target !== wrap) return;
    const key = e.key.toLowerCase();
    if (key === ' ' || key === 'k') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowRight') { video.currentTime = Math.min(video.duration || 0, video.currentTime + 5); }
    else if (e.key === 'ArrowLeft') { video.currentTime = Math.max(0, video.currentTime - 5); }
    else if (key === 'm') { muteBtn.click(); }
    else if (key === 'f') { fullBtn.click(); }
    else if (key === 's') { saveBtn.click(); }
    else if (e.key === '>' || e.key === '.') { stepSpeed(1); }
    else if (e.key === '<' || e.key === ',') { stepSpeed(-1); }
  });

  syncMute();
  setFill(seek, 0);
  setFill(vol, 100);
  return wrap;
}

function openModal(title, node) {
  const overlay = document.createElement('div');
  overlay.className = 'modal';
  const box = document.createElement('div');
  box.className = 'modal-box';

  const head = document.createElement('div');
  head.className = 'modal-head';
  const t = document.createElement('div');
  t.className = 'name';
  t.textContent = title;
  const close = document.createElement('button');
  close.className = 'ghost';
  close.textContent = 'Close';
  close.onclick = () => overlay.remove();
  head.append(t, close);

  const body = document.createElement('div');
  body.className = 'modal-body';
  body.append(node);

  box.append(head, body);
  overlay.append(box);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.append(overlay);
  return overlay;
}

// Minimal markdown: headings, lists, fenced code, bold, italic, inline code. All text is escaped first.
function renderMarkdown(src) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = s => s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>');
  let inCode = false;
  const out = [];
  for (const raw of src.split('\n')) {
    if (raw.startsWith('```')) {
      out.push(inCode ? '</code></pre>' : '<pre><code>');
      inCode = !inCode;
      continue;
    }
    if (inCode) { out.push(esc(raw)); continue; }
    const line = esc(raw);
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if (/^\s*[-*]\s+/.test(line)) { out.push('<li>' + inline(line.replace(/^\s*[-*]\s+/, '')) + '</li>'); continue; }
    out.push(line.trim() ? `<p>${inline(line)}</p>` : '');
  }
  return out.join('\n');
}

// Basic syntax highlighting: keywords and comments. Code is escaped before it is marked up.
function highlight(code, ext) {
  let s = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  if (['html', 'htm', 'xml', 'svg'].includes(ext)) {
    return s
      .replace(/(&lt;\/?)([\w:-]+)/g, '$1<span class="kw">$2</span>')
      .replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="cm">$1</span>');
  }
  if (ext === 'css') {
    return s
      .replace(/([\w-]+)(\s*:)/g, '<span class="kw">$1</span>$2')
      .replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="cm">$1</span>');
  }
  s = s.replace(new RegExp('\\b(' + KEYWORDS.join('|') + ')\\b', 'g'), '<span class="kw">$1</span>');
  const commentRe = ext === 'py' ? /(#.*)$/gm : /(\/\/.*)$/gm;
  return s.replace(commentRe, '<span class="cm">$1</span>');
}

// ---------- uploads and downloads with animated progress ----------
function createTransfer(kind, name, onCancel) {
  const el = document.createElement('div');
  el.className = `transfer ${kind} indeterminate`;
  const arrowPath = kind === 'upload' ? 'M18 24V12M13 17L18 12L23 17' : 'M18 12V24M13 19L18 24L23 19';
  el.innerHTML = `
    <svg viewBox="0 0 36 36" aria-hidden="true">
      <circle cx="18" cy="18" r="15" fill="none" stroke="#dde3ea" stroke-width="3"></circle>
      <circle class="ring" cx="18" cy="18" r="15" fill="none" stroke="#6db33f" stroke-width="3"
              stroke-linecap="round" stroke-dasharray="94.25" stroke-dashoffset="94.25"></circle>
      <path class="arrow" d="${arrowPath}" stroke="#6db33f" stroke-width="2.5" fill="none"
            stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <div class="t-info"><div class="t-name"></div><div class="t-state"></div></div>
    <div class="t-actions"><button class="t-cancel">Cancel</button></div>`;
  el.querySelector('.t-name').textContent = name;
  el.querySelector('.t-state').textContent = (kind === 'upload' ? 'Uploading' : 'Downloading') + '...';

  const ring = el.querySelector('.ring');
  const state = el.querySelector('.t-state');
  const actions = el.querySelector('.t-actions');
  el.querySelector('.t-cancel').onclick = () => { state.textContent = 'Cancelling...'; onCancel(); };
  $('transfers').append(el);

  return {
    progress(p) {
      if (p == null) { el.classList.add('indeterminate'); return; }
      el.classList.remove('indeterminate');
      ring.style.strokeDashoffset = 94.25 * (1 - p);
      state.textContent = Math.round(p * 100) + '%';
    },
    status(text) {
      el.classList.add('indeterminate');
      state.textContent = text;
    },
    done(text) {
      el.classList.remove('indeterminate');
      el.classList.add('done');
      state.textContent = text;
      actions.innerHTML = '';
      setTimeout(() => el.remove(), 3000);
    },
    fail(text, onRetry) {
      el.classList.remove('indeterminate');
      el.classList.add('fail');
      state.textContent = text;
      actions.innerHTML = '';
      if (onRetry) {
        const retry = document.createElement('button');
        retry.textContent = 'Retry';
        retry.onclick = () => { el.remove(); onRetry(); };
        actions.append(retry);
      }
      const dismiss = document.createElement('button');
      dismiss.textContent = 'Dismiss';
      dismiss.onclick = () => el.remove();
      actions.append(dismiss);
    }
  };
}

function uploadWithProgress(file, onProgress) {
  const xhr = new XMLHttpRequest();
  const promise = new Promise((resolve, reject) => {
    xhr.open('POST', '/api/files');
    xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    xhr.onload = () => {
      if (xhr.status >= 200 && xhr.status < 300) resolve(JSON.parse(xhr.responseText));
      else reject(new Error('Upload failed'));
    };
    xhr.onerror = () => reject(new Error('Network error'));
    xhr.onabort = () => reject(new Error('Cancelled'));
    const fd = new FormData();
    fd.append('file', file);
    xhr.send(fd);
  });
  return { promise, cancel: () => xhr.abort() };
}

function sendAttachment(file, type, target = room) {
  if (!target) return;
  const replyTo = replyingTo ? replyingTo.id : null;
  replyingTo = null;
  renderReplyBar();
  let up;
  const t = createTransfer('upload', file.name, () => up.cancel());
  const retry = () => sendAttachment(file, type, target);
  up = uploadWithProgress(file, p => t.progress(p));

  up.promise.then(meta => {
    t.status('Sending...');
    return ensureSocket()
      .then(() => stomp.send('/app/chat.send', {}, JSON.stringify({
        token, roomId: target.id, type, fileId: meta.id, content: '', replyTo
      })))
      .then(() => t.done('Sent'))
      .catch(() => t.fail('Failed to send', retry));
  }, err => {
    if (err.message === 'Cancelled') t.fail('Cancelled');
    else t.fail('Failed to upload', retry);
  });
}

async function downloadFile(url, name) {
  const ctrl = new AbortController();
  const t = createTransfer('download', name, () => ctrl.abort());
  try {
    const res = await fetch(url + '?download=true', { signal: ctrl.signal });
    if (!res.ok) throw new Error('Download failed');
    const total = Number(res.headers.get('Content-Length')) || 0;
    const reader = res.body.getReader();
    const chunks = [];
    let loaded = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      loaded += value.length;
      t.progress(total ? loaded / total : null);
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks));
    a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    t.done('Saved');
  } catch (e) {
    if (e.name === 'AbortError') t.fail('Cancelled');
    else t.fail('Failed to download', () => downloadFile(url, name));
  }
}

// ---------- sending text ----------
const pendingTexts = new Map(); // clientId -> { text, roomId, el, status, timer }

function newClientId() {
  return (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : 'c' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

function renderPendingText(clientId, text, roomId, replyTo = null) {
  const div = document.createElement('div');
  div.className = 'msg own pending';
  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = text;
  const status = document.createElement('div');
  status.className = 'status';
  div.append(body, status);
  $('messages').append(div);
  $('messages').scrollTop = $('messages').scrollHeight;
  pendingTexts.set(clientId, { text, roomId, replyTo, el: div, status, timer: null });
}

function transmitText(clientId) {
  const entry = pendingTexts.get(clientId);
  if (!entry) return;
  entry.el.className = 'msg own pending';
  entry.status.textContent = 'Sending...';
  clearTimeout(entry.timer);
  // If the server does not echo the message back in time, treat it as failed
  entry.timer = setTimeout(() => markTextFailed(clientId), 10000);
  ensureSocket()
    .then(() => stomp.send('/app/chat.send', {}, JSON.stringify({
      token, roomId: entry.roomId, type: 'TEXT', content: entry.text, clientId, replyTo: entry.replyTo
    })))
    .catch(() => markTextFailed(clientId));
}

function markTextFailed(clientId) {
  const entry = pendingTexts.get(clientId);
  if (!entry) return;
  clearTimeout(entry.timer);
  entry.el.className = 'msg own failed';
  entry.status.innerHTML = '';

  const label = document.createElement('span');
  label.textContent = 'Failed to send';
  const retry = document.createElement('button');
  retry.textContent = 'Retry';
  retry.onclick = () => transmitText(clientId);
  const dismiss = document.createElement('button');
  dismiss.className = 'ghost';
  dismiss.textContent = 'Dismiss';
  dismiss.onclick = () => { entry.el.remove(); pendingTexts.delete(clientId); };

  entry.status.append(label, retry, dismiss);
}

function resolvePending(clientId) {
  const entry = pendingTexts.get(clientId);
  if (!entry) return;
  clearTimeout(entry.timer);
  entry.el.remove();
  pendingTexts.delete(clientId);
}

async function sendText() {
  const input = $('msgInput');
  const text = input.value.trim();
  if (!text || !room) return;
  input.value = '';
  const clientId = newClientId();
  const replyTo = replyingTo ? replyingTo.id : null;
  replyingTo = null;
  renderReplyBar();
  renderPendingText(clientId, text, room.id, replyTo);
  transmitText(clientId);
}

  loadList();
}

// The key is shown once, right after the plugin is created
function showPluginKey(el, created) {
  el.innerHTML = '';
  const title = document.createElement('div');
  title.textContent = `Key for "${created.name}". Copy it now: it is shown only once.`;
  const box = document.createElement('div');
  box.className = 'key-box';
  box.textContent = created.key;
  const copy = document.createElement('button');
  copy.className = 'ghost';
  copy.textContent = 'Copy key';
  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(created.key);
      copy.textContent = 'Copied';
    } catch (e) {
      uiPrompt('Copy this key:', created.key);
    }
  };
  el.append(title, box, copy);
}

function groupMemberRow(member) {
  const row = document.createElement('div');
  row.className = 'ban-row';
  const label = document.createElement('span');
  label.textContent = `${member.displayName} @${member.username}`;
  const role = document.createElement('span');
  role.className = 'role-badge';
  role.textContent = member.role === 'member' ? '' : member.role;
  label.append(role);
  row.append(label);
  return row;
}

function renderGroupAdministration(el, d, base, reload) {
  const isOwner = d.myRole === 'owner';
  const note = document.createElement('div');
  note.className = 'muted';
  note.textContent = isOwner
    ? 'Admins can manage members, permissions and the invite link. Only you can change admins.'
    : 'Only the group owner can change admins.';
  el.append(note);

  d.members.forEach(member => {
    const row = groupMemberRow(member);
    if (isOwner && member.role !== 'owner') {
      const btn = document.createElement('button');
      btn.className = member.role === 'admin' ? 'ghost' : '';
      btn.textContent = member.role === 'admin' ? 'Remove admin' : 'Make admin';
      btn.onclick = async () => {
        try {
          if (member.role === 'admin') {
            await api(`${base}/admins/${encodeURIComponent(member.username)}`, { method: 'DELETE' });
          } else {
            await api(`${base}/admins`, { method: 'POST', json: { username: member.username } });
          }
          reload();
        } catch (e) {
          uiAlert(e.message);
        }
      };
      row.append(btn);
    }
    el.append(row);
  });
}

function renderGroupMembers(el, d, base, reload) {
  const count = document.createElement('div');
  count.className = 'muted';
  count.textContent = `${d.members.length} member${d.members.length === 1 ? '' : 's'}`;
  el.append(count);

  d.members.forEach(member => {
    const row = groupMemberRow(member);
    const isMe = member.username === me.username;
    const canRemove = (d.myRole === 'owner' || d.myRole === 'admin')
      && !isMe
      && member.role !== 'owner'
      && !(member.role === 'admin' && d.myRole !== 'owner');
    if (canRemove) {
      const btn = document.createElement('button');
      btn.className = 'danger';
      btn.textContent = 'Remove';
      btn.onclick = async () => {
        if (!(await uiConfirm(`Remove @${member.username} from this group?`))) return;
        try {
          await api(`${base}/members/${encodeURIComponent(member.username)}`, { method: 'DELETE' });
          reload();
        } catch (e) {
          uiAlert(e.message);
        }
      };
      row.append(btn);
    }
    el.append(row);
  });
}

// ---------- group: leave and delete ----------
// Called when a group is deleted while it is open or listed on this screen
function handleGroupDeleted(m) {
  const viewing = room && room.id === m.roomId;
  if (viewing) closeChat();
  refreshLists();
  // The person who deleted the group already saw the result, so only tell the others
  if (viewing && m.sender !== me.username) {
    uiAlert(`The group was deleted by @${m.sender}. Its messages have been removed.`);
  }
}

$('leaveGroupBtn').onclick = async () => {
  if (!room || room.kind !== 'group') return;
  if (!(await uiConfirm(`Leave "${room.title}"? You will need an invite link to join again.`))) return;
  try {
    await api(`/api/groups/${encodeURIComponent(room.groupId)}/leave`, { method: 'POST' });
    closeChat();
    await refreshLists();
  } catch (e) {
    uiAlert(e.message);
  }
};

$('deleteGroupBtn').onclick = async () => {
  if (!room || room.kind !== 'group') return;
  if (!(await uiConfirm(`Delete the group "${room.title}" for everyone? All of its messages will be removed.`))) return;
  try {
    await api(`/api/groups/${encodeURIComponent(room.groupId)}`, { method: 'DELETE' });
    closeChat();
    await refreshLists();
  } catch (e) {
    uiAlert(e.message);
  }
};

$('deleteAllMsgsBtn').onclick = async () => {
  if (!room || room.kind !== 'group') return;
  if (!(await uiConfirm(`Delete all messages in "${room.title}" for everyone? The group will stay.`))) return;
  const target = room;
  try {
    const updated = await api(`/api/groups/${encodeURIComponent(target.groupId)}/messages`, { method: 'DELETE' });
    updated.forEach(m => { if (room && room.id === target.id) addMessage(m); });
  } catch (e) {
    uiAlert(e.message);
  }
};

// ---------- reply and delete ----------
let replyingTo = null;

function previewOf(m) {
  if (m.type === 'TEXT') return (m.content || '').slice(0, 80);
  return m.fileName ? `[${m.type.toLowerCase()}] ${m.fileName}` : `[${m.type.toLowerCase()}]`;
}

function renderReplyBar() {
  const bar = $('replyBar');
  if (!replyingTo) {
    bar.classList.add('hidden');
    return;
  }
  $('replyText').textContent = `Replying to @${replyingTo.sender}: ${replyingTo.text}`;
  bar.classList.remove('hidden');
}

function startReply(m) {
  replyingTo = { id: m.id, sender: m.sender, text: previewOf(m) };
  renderReplyBar();
  $('msgInput').focus();
}

$('replyCancel').onclick = () => {
  replyingTo = null;
  renderReplyBar();
};

async function deleteMessage(m) {
  if (!(await uiConfirm('Delete this message? It will be removed for everyone in this chat.'))) return;
  try {
    const updated = await api('/api/messages/' + encodeURIComponent(m.id), { method: 'DELETE' });
    if (room && updated.roomId === room.id) addMessage(updated);
  } catch (e) {
    uiAlert(e.message);
  }
}

// ---------- app dialogs (replace the browser's alert, confirm and prompt) ----------
function showDialog({ title, message, input = false, showCancel = false, defaultValue = '', okText = 'OK', cancelText = 'Cancel' }) {
  return new Promise(resolve => {
    const field = $('dlgInput');
    const ok = $('dlgOk');
    const cancel = $('dlgCancel');

    $('dlgTitle').textContent = title;
    $('dlgMsg').textContent = message;
    field.classList.toggle('hidden', !input);
    field.value = defaultValue;
    cancel.classList.toggle('hidden', !showCancel);
    ok.textContent = okText;
    cancel.textContent = cancelText;
    $('dialog').classList.remove('hidden');
    (input ? field : ok).focus();

    const finish = result => {
      $('dialog').classList.add('hidden');
      ok.onclick = null;
      cancel.onclick = null;
      field.onkeydown = null;
      $('dialog').onkeydown = null;
      resolve(result);
    };
    const cancelValue = input ? null : false;

    ok.onclick = () => finish(input ? field.value : true);
    cancel.onclick = () => finish(cancelValue);
    field.onkeydown = e => {
      if (e.key === 'Enter') finish(field.value);
      if (e.key === 'Escape') finish(null);
    };
    $('dialog').onkeydown = e => {
      if (e.key === 'Escape') finish(showCancel ? cancelValue : true);
    };
  });
}

function uiAlert(message, title = 'Spring Chat') {
  return showDialog({ title, message });
}

function uiConfirm(message, title = 'Please confirm') {
  return showDialog({ title, message, showCancel: true, okText: 'Yes', cancelText: 'No' }).then(Boolean);
}

// Resolves to the typed text, or null if cancelled
function uiPrompt(message, defaultValue = '', title = 'Enter a value') {
  return showDialog({ title, message, input: true, showCancel: true, defaultValue });
}

// ---------- 404 page ----------
function isKnownPath() {
  return location.pathname === '/' || location.pathname === '/index.html';
}

function showNotFound(title, text) {
  $('nfTitle').textContent = title;
  $('nfText').textContent = text;
  $('notFound').classList.remove('hidden');
}

$('nfHome').onclick = () => { location.href = '/'; };

(async function init() {
  if (!isKnownPath()) {
    showNotFound('Page not found', `There is no page at ${location.pathname}. The link may be wrong or the page may have moved.`);
    return;
  }
  if (!token) return;
  try {
    await startSession();
  } catch (e) {
    forgetToken();
  }
})();
</script>
